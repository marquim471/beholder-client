<link href="game_forge.css" />
<html>
  <div style="width: 100%; height: 100%" placement="center">
    <window
      *if="not self.showResult and not self.showBonus"
      class="forge-window"
      text="Exaltation Forge"
      placement="center"
      onescape="self:hide()"
    >
      <div class="tabs">
        <img
          class="tabs-img-fusion"
          src="/modules/game_forge/images/fusionButton.png"
          *image-clip="self.fusion.clip"
          onclick="self:toggleFusionMenu()"
        />
        <img
          class="tabs-img"
          src="/modules/game_forge/images/transferButton.png"
          *image-clip="self.transfer.clip"
          onclick="self:toggleTransferMenu()"
        />
        <img
          class="tabs-img"
          src="/modules/game_forge/images/conversionButton.png"
          *image-clip="self.conversion.clip"
          onclick="self:toggleConversionMenu()"
        />
        <img
          class="tabs-img-history"
          src="/modules/game_forge/images/historyButton.png"
          *image-clip="self.history.clip"
          onclick="self:toggleHistoryMenu()"
        />
      </div>

      <div class="content">
        <div *if="self.currentTab == 'fusion'" class="transfer-container fusion-container">
          <div class="transfer-select-container fusion-selection">
            <label class="transfer-header" text="Select Item For Fusion" />
            <div class="transfer-select-wrapper">
              <div class="fusion-item-grid fusion-source-grid">
                <ForgeItemViewport
                  class="fusion-item-viewport"
                  layout="type: grid; cell-size: 34 34; cell-spacing: 3; num-columns: 4"
                  onlayoutupdate="self:updateItemScroll(target, 'fusion-source-scroll')"
                >
                  <div
                    *for="local item in (self.fusion.currentList or {})"
                    onclick="self.fusion.handleSelect(item)"
                    onhover="self:handleDescription('fusion-select-item', event.value, target)"
                  >
                    <div
                      class="item-to-select"
                      onhover="self:handleDescription('fusion-select-item', event.value, target)"
                    >
                      <img
                        *image-source="item.imagePath"
                        *image-clip="item.rarityClipObject"
                        *border-width="1"
                        *border-color="self.fusion.selected.key == item.key and 'white' or 'transparent'"
                        class="item-rarity"
                      />
                      <UIItem
                        *item-id="item.id"
                        style="
                          height: 32px;
                          width: 32px;
                          align-items: center;
                          padding-left: 2px;
                        "
                      />
                      <img
                        *if="item.tier>0"
                        class="item-tier-strip" placement="top-right"
                        src="/images/inventory/tiers-strip.png"
                        *image-clip="item.clip"
                      />
                      <label class="item-count">{{item.count}}</label>
                    </div>
                  </div>
                </ForgeItemViewport>
                <ForgeHistoryScrollBar id="fusion-source-scroll" class="fusion-item-scrollbar" />
                <ForgeHistoryFrame class="fusion-item-frame" placement="center" />
              </div>
              <div class="fusion-selection-controls">
                <div class="fusion-selection-arrows">
                  <img
                    src="/modules/game_forge/images/arrows/icon-arrow-rightlarge.png"
                    width="14"
                    height="25"
                  />
                  <img
                    src="/modules/game_forge/images/arrows/icon-arrow-rightlarge.png"
                    width="14"
                    height="25"
                    style="margin-left: 5px"
                  />
                  <img
                    src="/modules/game_forge/images/arrows/icon-arrow-rightlarge.png"
                    width="14"
                    height="25"
                    style="margin-left: 5px"
                  />
                </div>
                <ForgeConvergenceCheck
                  id="fusion_convergence"
                  class="fusion-convergence-check"
                  text="Convergence"
                  *checked="self.fusion.isConvergence"
                  onchange="self:toggleConvergence(false)"
                />
              </div>
              <div
                class="fusion-selected-preview"
                onhover="self:handleDescription('fusion-select-item', event.value, target)"
              >
                <div class="fusion-preview-object" placement="center">
                  <img
                    *if="self.fusion.selected.id == -1"
                    class="fusion-question-mark"
                    placement="center"
                    src="/images/ui/icon-questionmark.png"
                    width="8"
                    height="21"
                  />
                  <UIItem placement="center"
                    *item-id="self.fusion.selected.id"
                    style="
                      height: 64px;
                      width: 64px;
                      position: absolute;
                      virtual: true;
                    "
                    shader="Outfit - cyclopedia-black"
                  />
                  <img
                    *if="self.fusion.selected.targetTier > 0"
                    class="item-tier-strip" placement="top-right"
                    src="/images/inventory/tiers-strip-big.png"
                    *image-clip="ItemsDatabase.getTierClip(self.fusion.selected.targetTier, false)"
                  />
                </div>
              </div>
            </div>
          </div>
          <div class="transfer-select-container fusion-requirements">
            <label class="transfer-header" *text="self.fusion.title" />
            <div class="transfer-requirements-wrapper">
              <div class="fusion-item-grid fusion-resource-grid" *if="self.fusion.isConvergence">
                <ForgeItemViewport
                  class="fusion-item-viewport"
                  layout="type: grid; cell-size: 34 34; cell-spacing: 3; num-columns: 4"
                  onlayoutupdate="self:updateItemScroll(target, 'fusion-resource-scroll')"
                >
                  <div
                    *for="local item in (self.fusion.convergenceItems or {})"
                    *if="self.fusion.isConvergence and self.fusion.selected.id ~= -1 and item.tier == self.fusion.selected.tier and item.slot == self.fusion.selected.slot and item.count >= (item.id == self.fusion.selected.id and 2 or 1)"
                    onclick="self:handleSelectTarget(item, false)"
                  >
                    <div class="item-to-select">
                      <img
                        *image-source="item.imagePath"
                        *image-clip="item.rarityClipObject"
                        *border-width="1"
                        *border-color="self.fusion.selectedTarget.key == item.key and 'white' or 'transparent'"
                        class="item-rarity"
                      />
                      <UIItem
                        *item-id="item.id"
                        style="
                          height: 32px;
                          width: 32px;
                          align-items: center;
                          padding-left: 2px;
                        "
                      />
                      <img
                        *if="item.tier>0"
                        class="item-tier-strip" placement="top-right"
                        src="/images/inventory/tiers-strip.png"
                        *image-clip="item.clip"
                      />
                      <label class="item-count">{{item.count}}</label>
                    </div>
                  </div>
                </ForgeItemViewport>
                <ForgeHistoryScrollBar id="fusion-resource-scroll" class="fusion-item-scrollbar" />
                <ForgeHistoryFrame class="fusion-item-frame" placement="center" />
              </div>
              <div class="transfer-requirement-item-container" *if="not self.fusion.isConvergence"
                onhover="self:handleDescription('fusion-preview-item', event.value, target)">
                <ForgePreviewBox id="fusionResourcePreview" class="fusion-requirement-preview">
                  <ForgeConversionItem class="fusion-resource-preview" placement="center" *item-id="self.fusion.selected.id" />
                  <img class="fusion-question-mark" placement="center" *if="self.fusion.selected.id == -1"
                    src="/images/ui/icon-questionmark.png" />
                  <img class="item-tier-strip" placement="top-right" *if="self.fusion.selected.tier > 0"
                    src="/images/inventory/tiers-strip-big.png" *image-clip="ItemsDatabase.getTierClip(self.fusion.selected.tier, false)" />
                </ForgePreviewBox>
                <ForgeBalanceBox class="fusion-requirement-cost">
                  <label class="fusion-cost-count" placement="center" *text="self.fusion.selected.countLabel:gsub(' ', '')"
                    *color="self:getColor('fusion-preview-count-label')" />
                </ForgeBalanceBox>
              </div>
              <div class="transfer-requirement-item-container" onhover="self:handleDescription('fusion-cost-dust', event.value, target)">
                <ForgePreviewBox id="fusionDustPreview" class="fusion-requirement-preview">
                  <ForgeDustItem class="fusion-resource-preview" placement="center" />
                </ForgePreviewBox>
                <ForgeBalanceBox class="fusion-requirement-cost">
                  <label id="fusionDustCostValue" class="fusion-cost-value" *text="self.fusion.dustLabel" *color="self:getColor('fusion-dust')" />
                  <img class="fusion-dust-cost-icon" placement="center-right"
                    src="/modules/game_forge/images/icon-currency-dust.png"
                    *margin-right="math.floor((target:getParent():getWidth() - 9 - target:getParent():getChildById('fusionDustCostValue'):getTextSize().width) / 2)" />
                </ForgeBalanceBox>
              </div>
              <div
                class="fusion-buttons-container"
                *width="self.fusion.isConvergence and 51 or 140"
              >
                <div class="fusion-improvement" *if="not self.fusion.isConvergence"
                  onhover="self:handleDescription('fusion-improve-chance', event.value, target)">
                  <div class="fusion-improvement-heading">
                    <label class="fusion-improvement-caption" text="Success Rate:" />
                    <label class="fusion-improvement-value" *text="self.fusion.chanceImprovedLabel" *color="self:getColor('improve-chance')" />
                  </div>
                  <div class="fusion-improvement-controls">
                    <ForgeImproveButton class="fusion-improve-button" id="fusion-improve-chance"
                      text="Improve to 65%" *checked="self.fusion.chanceImprovedChecked"
                      onclick="self.fusion.exaltedCoreImprovements('improve-chance')"
                      *disabled="self.currentExaltedCores <= 0 or self.fusion.reduceTierLossChecked and self.currentExaltedCores == 1" />
                    <ForgeBalanceBox class="fusion-improvement-cost">
                      <label class="fusion-improvement-cost-value" placement="center" text="1" *color="self:getColor('improve-chance-cost')" />
                      <img class="fusion-improvement-core" placement="center-right"
                        src="/modules/game_forge/images/icon-currency-exaltedcore.png" />
                    </ForgeBalanceBox>
                  </div>
                </div>
                <div class="fusion-improvement fusion-improvement-second" *if="not self.fusion.isConvergence"
                  onhover="self:handleDescription('fusion-reduce-loss', event.value, target)">
                  <div class="fusion-improvement-heading">
                    <label class="fusion-improvement-caption" text="Tier Loss:" />
                    <label class="fusion-improvement-value" *text="self.fusion.reduceTierLossLabel" *color="self:getColor('reduce-loss')" />
                  </div>
                  <div class="fusion-improvement-controls">
                    <ForgeImproveButton class="fusion-improve-button" id="fusion-reduce-loss"
                      text="Reduce to 50%" *checked="self.fusion.reduceTierLossChecked"
                      onclick="self.fusion.exaltedCoreImprovements('reduce-loss')"
                      *disabled="self.currentExaltedCores <= 0 or self.fusion.chanceImprovedChecked and self.currentExaltedCores == 1" />
                    <ForgeBalanceBox class="fusion-improvement-cost">
                      <label class="fusion-improvement-cost-value" placement="center" text="1" *color="self:getColor('reduce-loss-cost')" />
                      <img class="fusion-improvement-core" placement="center-right"
                        src="/modules/game_forge/images/icon-currency-exaltedcore.png" />
                    </ForgeBalanceBox>
                  </div>
                </div>
              </div>
              <div
                class="fusion-requirements-arrow"
                *width="self.fusion.isConvergence and 24 or 34"
              >
                <img
                  src="/modules/game_forge/images/arrows/icon-arrow-rightlarge.png"
                  width="14"
                  height="25"
                  *margin-left="self.fusion.isConvergence and 0 or 10"
                />
              </div>
              <div class="transfer-button-container" onhover="self:handleDescription('fusion-forge-action', event.value, target)">
                <ForgeDustLimitButton id="fusionActionButton" class="fusion-action-button"
                  *disabled="not self.fusion.canFusion or self.rawPrice <= 0 or self.rawCurrentGold < self.rawPrice or self.currentDust < (self.fusion.isConvergence and self.fusion.convergenceDust or self.fusion.dust)" onclick="self:forgeAction(false)">
                  <div class="fusion-action-preview" placement="center">
                    <div class="fusion-action-item-box" placement="center-left">
                      <ForgeConversionItem class="fusion-action-item" placement="center" *item-id="self.fusion.selected.id" />
                      <img class="fusion-action-question" placement="center" *if="self.fusion.selected.id == -1" src="/images/ui/icon-questionmark.png" />
                      <img class="fusion-action-tier" placement="top-right" *if="self.fusion.selected.tier > 0"
                        src="/images/inventory/tiers-strip.png" *image-clip="self.fusion.selected.clip" />
                    </div>
                    <img class="fusion-action-arrows" placement="center" src="/modules/game_forge/images/arrows/icon-arrows.png" />
                    <div class="fusion-action-item-box" placement="center-right">
                      <ForgeConversionItem class="fusion-action-item" placement="center" *item-id="self.fusion.selected.id" />
                      <img class="fusion-action-question" placement="center" *if="self.fusion.selected.id == -1" src="/images/ui/icon-questionmark.png" />
                      <img class="fusion-action-tier" placement="top-right" *if="self.fusion.selected.targetTier > 0"
                        src="/images/inventory/tiers-strip.png" *image-clip="self.fusion.selected.targetClip" />
                    </div>
                  </div>
                  <ForgeConversionOverlay class="fusion-action-overlay" placement="center" *visible="not self.fusion.canFusion or self.rawPrice <= 0 or self.rawCurrentGold < self.rawPrice or self.currentDust < (self.fusion.isConvergence and self.fusion.convergenceDust or self.fusion.dust)" />
                </ForgeDustLimitButton>
                <ForgeBalanceBox class="fusion-action-cost">
                  <label id="fusionGoldCostValue" class="fusion-cost-value" *text="self.formattedPrice" *color="self:getColor('price')" />
                  <img class="fusion-action-gold" placement="center-right" src="/images/game/prey/icon-goldcoin.png"
                    *margin-right="math.floor((target:getParent():getWidth() - 9 - target:getParent():getChildById('fusionGoldCostValue'):getTextSize().width) / 2)" />
                </ForgeBalanceBox>
              </div>
            </div>
          </div>
          <div class="transfer-description">
            <label class="fusion-description-text" *if="self.description ~= ''" *text="self.description" />
            <div class="fusion-description-default" *if="self.description == ''">
              <div class="fusion-description-row" *for="local row in (self.fusion.isConvergence and self.fusion.convergenceDescriptionRows or self.fusion.descriptionRows)" onlayoutupdate="self:configureFusionHelp(target, row)">
                <label *text="row.text" />
                <img class="fusion-description-help" *if="row.tooltip ~= nil" src="/images/skin/show-gui-help-grey.png" />
              </div>
            </div>
          </div>
        </div>
        <div *if="self.currentTab == 'transfer'" class="transfer-container">
          <div class="transfer-select-container transfer-selection">
            <label class="transfer-header" text="Select Items for the Transfer" />
            <div class="transfer-select-wrapper">
              <div class="transfer-item-grid transfer-donors-grid">
                <ForgeItemViewport class="transfer-item-viewport"
                  layout="type: grid; cell-size: 34 34; cell-spacing: 3; num-columns: 4"
                  onlayoutupdate="self:updateItemScroll(target, 'transfer-donors-scroll')">
                  <div *for="local item in (self.transfer.currentList.donors or {})"
                    onclick="self.transfer.handleSelect(item)" onhover="self:handleDescription('transfer-cost-donor-item', event.value, target)">
                    <div class="item-to-select">
                      <img *if="item.imagePath" *image-source="item.imagePath" *image-clip="item.rarityClipObject"
                        *border-width="1" *border-color="self.transfer.selected.key == item.key and 'white' or 'transparent'" class="item-rarity" />
                      <UIItem *item-id="item.id" style="height: 32px; width: 32px; align-items: center; padding-left: 2px;" />
                      <img *if="item.tier > 0" class="item-tier-strip" placement="top-right"
                        src="/images/inventory/tiers-strip.png" *image-clip="item.clip" />
                      <label class="item-count">{{item.count}}</label>
                    </div>
                  </div>
                </ForgeItemViewport>
                <ForgeHistoryScrollBar id="transfer-donors-scroll" class="transfer-item-scrollbar" />
                <ForgeHistoryFrame class="transfer-item-frame" placement="center" />
              </div>
              <div class="transfer-selection-controls">
                <div class="transfer-selection-arrows">
                  <img src="/modules/game_forge/images/arrows/icon-arrow-rightlarge.png" width="14" height="25" />
                  <img src="/modules/game_forge/images/arrows/icon-arrow-rightlarge.png" width="14" height="25" style="margin-left: 5px" />
                  <img src="/modules/game_forge/images/arrows/icon-arrow-rightlarge.png" width="14" height="25" style="margin-left: 5px" />
                </div>
                <ForgeConvergenceCheck id="transfer_convergence" class="transfer-convergence-check" text="Convergence"
                  *checked="self.transfer.isConvergence" onchange="self:toggleConvergence(true)"
                  onhover="self:handleDescription('transfer-convergence', event.value, target)" />
              </div>
              <div class="transfer-item-grid transfer-receivers-grid">
                <ForgeItemViewport class="transfer-item-viewport"
                  layout="type: grid; cell-size: 34 34; cell-spacing: 3; num-columns: 4"
                  onlayoutupdate="self:updateItemScroll(target, 'transfer-receivers-scroll')">
                  <div *for="local item in (self.transfer.currentList.receivers or {})"
                    *if="self.transfer.selected.id ~= -1 and self.transfer.selected.id ~= item.id and self.transfer.selected.slot == item.slot"
                    onclick="self:handleSelectTarget(item, true)" onhover="self:handleDescription('transfer-cost-receiver-item', event.value, target)">
                    <div class="item-to-select">
                      <img *if="item.imagePath" *image-source="item.imagePath" *image-clip="item.rarityClipObject"
                        *border-width="1" *border-color="self.transfer.selectedTarget.key == item.key and 'white' or 'transparent'" class="item-rarity" />
                      <UIItem *item-id="item.id" style="height: 32px; width: 32px; align-items: center; padding-left: 2px;" />
                      <img *if="item.tier > 0" class="item-tier-strip" placement="top-right"
                        src="/images/inventory/tiers-strip.png" *image-clip="item.clip" />
                      <label class="item-count">{{item.count}}</label>
                    </div>
                  </div>
                </ForgeItemViewport>
                <ForgeHistoryScrollBar id="transfer-receivers-scroll" class="transfer-item-scrollbar" />
                <ForgeHistoryFrame class="transfer-item-frame" placement="center" />
              </div>
            </div>
          </div>

          <div class="transfer-select-container transfer-requirements">
            <label class="transfer-header" *text="self.transfer.title" />
            <div class="transfer-requirements-wrapper">
              <div class="transfer-requirement-item-container"
                onhover="self:handleDescription('transfer-cost-donor-preview', event.value, target)">
                <ForgePreviewBox id="transferResourcePreview" class="transfer-requirement-preview">
                  <ForgeConversionItem class="transfer-resource-preview" placement="center" *item-id="self.transfer.selected.id" />
                  <img class="transfer-question-mark" placement="center" *if="self.transfer.selected.id == -1"
                    src="/images/ui/icon-questionmark.png" />
                  <img class="item-tier-strip" placement="top-right" *if="self.transfer.selected.tier > 0"
                    src="/images/inventory/tiers-strip-big.png" *image-clip="ItemsDatabase.getTierClip(self.transfer.selected.tier, false)" />
                </ForgePreviewBox>
                <ForgeBalanceBox class="transfer-requirement-cost">
                  <label class="transfer-cost-count" placement="center" *text="self.transfer.selected.countLabel:gsub(' ', '')"
                    *color="self:getColor('transfer-preview-count-label')" />
                </ForgeBalanceBox>
              </div>
              <div class="transfer-requirement-item-container" onhover="self:handleDescription('transfer-cost-dust', event.value, target)">
                <ForgePreviewBox id="transferDustPreview" class="transfer-requirement-preview">
                  <ForgeDustItem class="transfer-resource-preview" placement="center" />
                </ForgePreviewBox>
                <ForgeBalanceBox class="transfer-requirement-cost">
                  <label id="transferDustCostValue" class="transfer-cost-value" *text="self.transfer.dustLabel" *color="self:getColor('transfer-dust')" />
                  <img class="transfer-dust-cost-icon" placement="center-right"
                    src="/modules/game_forge/images/icon-currency-dust.png"
                    *margin-right="math.floor((target:getParent():getWidth() - 9 - target:getParent():getChildById('transferDustCostValue'):getTextSize().width) / 2)" />
                </ForgeBalanceBox>
              </div>
              <div class="transfer-requirement-item-container" onhover="self:handleDescription('transfer-cost-exalted-core', event.value, target)">
                <ForgePreviewBox id="transferCorePreview" class="transfer-requirement-preview">
                  <ForgeCoreItem class="transfer-resource-preview" placement="center" />
                </ForgePreviewBox>
                <ForgeBalanceBox class="transfer-requirement-cost">
                  <label id="transferCoreCostValue" class="transfer-cost-value" *text="self.transfer.exaltedCoresLabel" *color="self:getColor('transfer-exalted')" />
                  <img class="transfer-core-cost-icon" placement="center-right"
                    src="/modules/game_forge/images/icon-currency-exaltedcore.png"
                    *margin-right="math.floor((target:getParent():getWidth() - 9 - target:getParent():getChildById('transferCoreCostValue'):getTextSize().width) / 2)" />
                </ForgeBalanceBox>
              </div>
              <div class="transfer-requirements-arrow">
                <img placement="center" src="/modules/game_forge/images/arrows/icon-arrow-rightlarge.png" width="14" height="25" />
              </div>
              <div class="transfer-button-container" onhover="self:handleDescription('transfer-forge-action', event.value, target)">
                <ForgeDustLimitButton id="transferActionButton" class="transfer-action-button"
                  *disabled="not self.transfer.canTransfer or self.currentExaltedCores < self.transfer.necessaryExaltedCores or self.rawPrice <= 0 or self.rawCurrentGold < self.rawPrice or self.currentDust < (self.transfer.isConvergence and self.transfer.convergenceDust or self.transfer.dust)" onclick="self:forgeAction(true)">
                  <div class="transfer-action-preview" placement="center">
                    <div class="transfer-action-item-box" placement="center-left">
                      <ForgeConversionItem class="transfer-action-item" placement="center" *item-id="self.transfer.selected.id" />
                      <img class="transfer-action-question" placement="center" *if="self.transfer.selected.id == -1" src="/images/ui/icon-questionmark.png" />
                      <img class="transfer-action-tier" placement="top-right" *if="self.transfer.selected.tier > 0"
                        src="/images/inventory/tiers-strip.png" *image-clip="self.transfer.selected.clip" />
                    </div>
                    <img class="transfer-action-arrows" placement="center" src="/modules/game_forge/images/arrows/icon-arrows.png" />
                    <div class="transfer-action-item-box" placement="center-right">
                      <ForgeConversionItem class="transfer-action-item" placement="center" *item-id="self.transfer.selectedTarget.id" />
                      <img class="transfer-action-question" placement="center" *if="self.transfer.selectedTarget.id == -1" src="/images/ui/icon-questionmark.png" />
                      <img class="transfer-action-tier" placement="top-right" *if="self.transfer.selectedTarget.targetTier > 0"
                        src="/images/inventory/tiers-strip.png" *image-clip="self.transfer.selectedTarget.clip" />
                    </div>
                  </div>
                  <ForgeConversionOverlay class="transfer-action-overlay" placement="center" *visible="not self.transfer.canTransfer or self.currentExaltedCores < self.transfer.necessaryExaltedCores or self.rawPrice <= 0 or self.rawCurrentGold < self.rawPrice or self.currentDust < (self.transfer.isConvergence and self.transfer.convergenceDust or self.transfer.dust)" />
                </ForgeDustLimitButton>
                <ForgeBalanceBox class="transfer-action-cost">
                  <label id="transferGoldCostValue" class="transfer-cost-value" *text="self.formattedPrice" *color="self:getColor('price')" />
                  <img class="transfer-action-gold" placement="center-right" src="/images/game/prey/icon-goldcoin.png"
                    *margin-right="math.floor((target:getParent():getWidth() - 9 - target:getParent():getChildById('transferGoldCostValue'):getTextSize().width) / 2)" />
                </ForgeBalanceBox>
              </div>
            </div>
          </div>
          <div class="transfer-description">
            <label class="transfer-description-text"
              *text="self.description ~= '' and self.description or (self.transfer.isConvergence and self.transfer.convergenceDescription or self.transfer.description)" />
          </div>
        </div>

        <div *if="self.currentTab == 'conversion'" class="conversion-container">
          <div class="conversion-wrapper">
            <div class="conversion-column" onhover="self:handleDescription('convert-dust', event.value, target)">
              <label class="conversion-column-header" text="Convert Dust" />
              <div class="conversion-column-img">
                <ForgeBalanceBox
                  class="conversion-column-item-container"
                  onhover="self:handleDescription('convert-dust', event.value, target)"
                >
                  <UIItem placement="center" style="virtual: true; always-show-count: false; item-count: 100; item-id: 37160" />
                </ForgeBalanceBox>
                <ForgeBalanceBox
                  class="conversion-column-item-cost"
                  onhover="self:handleDescription('convert-dust', event.value, target)"
                >
                  <label id="dustCostValue" class="conversion-cost-value" *color="self.currentDust < self.conversion.necessaryDustToSliver and '#d33c3c' or '#c0c0c0'" *text="self.conversion.necessaryDustToSliver" />
                  <img placement="center-right"
                    src="/modules/game_forge/images/icon-currency-dust.png"
                    width="9"
                    height="6" class="conversion-dust-icon"
                    *margin-right="math.floor((target:getParent():getWidth() - 9 - target:getParent():getChildById('dustCostValue'):getTextSize().width) / 2)" style="margin-top: 1px"
                  />
                </ForgeBalanceBox>
                <div>
                  <img
                    class="conversion-arrow"
                    src="/modules/game_forge/images/arrows/icon-arrow-downlarge.png"
                    width="25"
                    height="14"
                  />
                </div>
                <div class="conversion-column-item-conversion-button" onhover="self:handleDescription('convert-dust-cost', event.value, target)">
                  <ForgeSliverButton id="forgeConvertDust"
                    class="conversion-button"
                    *disabled="self.conversion.disableDustConversion"
                    onclick="self.conversion.toggle(2)">
                    <ForgeSliverItem class="conversion-preview" placement="center" />
                    <ForgeConversionOverlay class="conversion-overlay" placement="center" *visible="self.conversion.disableDustConversion" />
                  </ForgeSliverButton>
                </div>
                <div class="conversion-action">
                  <label *text="self.conversion.dustToSilverLabel" />
                  <img src="/modules/game_forge/images/icon-currency-sliver.png" />
                </div>
              </div>
            </div>
            <div onhover="self:handleDescription('convert-sliver', event.value, target)" class="conversion-column conversion-column-middle" style="margin-left: 5px">
              <label class="conversion-column-header" text="Convert Slivers" />
              <div class="conversion-column-img">
                <ForgeBalanceBox
                  class="conversion-column-item-container"
                  onhover="self:handleDescription('convert-sliver', event.value, target)"
                >
                  <UIItem placement="center" style="virtual: true; always-show-count: false; item-count: 100; item-id: 37109" />
                </ForgeBalanceBox>
                <ForgeBalanceBox
                  class="conversion-column-item-cost"
                  onhover="self:handleDescription('convert-sliver', event.value, target)"
                >
                  <label id="sliverCostValue" class="conversion-cost-value" *color="self.currentSlivers < self.conversion.sliverToCore and '#d33c3c' or '#c0c0c0'" *text="self.conversion.sliverToCore" />
                  <img placement="center-right"
                    *margin-right="math.floor((target:getParent():getWidth() - 9 - target:getParent():getChildById('sliverCostValue'):getTextSize().width) / 2)" style="margin-top: 1px"
                    src="/modules/game_forge/images/icon-currency-sliver.png"
                    width="9"
                    height="9"
                  />
                </ForgeBalanceBox>
                <div>
                  <img
                    class="conversion-arrow"
                    src="/modules/game_forge/images/arrows/icon-arrow-downlarge.png"
                    width="25"
                    height="14"
                  />
                </div>
                <div class="conversion-column-item-conversion-button" onhover="self:handleDescription('convert-sliver-cost', event.value, target)">
                  <ForgeCoreButton id="forgeConvertSlivers"
                    class="conversion-button"
                    *disabled="self.conversion.disableSliverConversion"
                    onclick="self.conversion.toggle(3)">
                    <ForgeCoreItem class="conversion-preview" placement="center" />
                    <ForgeConversionOverlay class="conversion-overlay" placement="center" *visible="self.conversion.disableSliverConversion" />
                  </ForgeCoreButton>
                </div>
                <div class="conversion-action">
                  <label *text="self.conversion.sliverToCoreLabel" />
                  <img src="/modules/game_forge/images/icon-currency-exaltedcore.png" />
                </div>
              </div>
            </div>
            <div class="conversion-column" style="margin-left: 5px" onhover="self:handleDescription('increase-dust-limit', event.value, target)">
              <label class="conversion-column-header" text="Increase Dust Limit" />
              <div class="conversion-column-img">
                <ForgeBalanceBox
                  class="conversion-column-item-container"
                  onhover="self:handleDescription('increase-dust-limit', event.value, target)"
                >
                  <UIItem placement="center" style="virtual: true; always-show-count: false; item-count: 100; item-id: 37160" />
                </ForgeBalanceBox>
                <ForgeBalanceBox
                  class="conversion-column-item-cost"
                  onhover="self:handleDescription('increase-dust-limit', event.value, target)"
                >
                  <label id="dustLimitCostValue" class="conversion-cost-value" *color="self.conversion.dustMax < self.conversion.dustCap and self.currentDust < self.conversion.dustMaxIncreaseCost and '#d33c3c' or '#c0c0c0'" *text="self.conversion.dustMax >= self.conversion.dustCap and '-' or self.conversion.dustMaxIncreaseCost" />
                  <img placement="center-right"
                    *margin-right="math.floor((target:getParent():getWidth() - 9 - target:getParent():getChildById('dustLimitCostValue'):getTextSize().width) / 2)" style="margin-top: 1px"
                    src="/modules/game_forge/images/icon-currency-dust.png"
                    width="9"
                    height="6" class="conversion-dust-icon"
                  />
                </ForgeBalanceBox>
                <div>
                  <img
                    class="conversion-arrow"
                    src="/modules/game_forge/images/arrows/icon-arrow-downlarge.png"
                    width="25"
                    height="14"
                  />
                </div>
                <div class="conversion-column-item-increase-button" onhover="self:handleDescription('increase-dust-limit-cost', event.value, target)">
                  <ForgeDustLimitButton id="forgeIncreaseDustLimit"
                    class="conversion-button"
                    *disabled="self.conversion.disableIncreaseDustLimit"
                    onclick="self.conversion.toggle(4)">
                    <div class="conversion-double-preview" placement="center">
                      <ForgeDustItem class="conversion-double-first" />
                      <ForgeDustItem class="conversion-double-second" />
                    </div>
                    <ForgeConversionOverlay class="conversion-overlay" placement="center" *visible="self.conversion.disableIncreaseDustLimit" />
                  </ForgeDustLimitButton>
                </div>
                <div class="conversion-limit-action">
                  <label class="conversion-limit-caption" *text="self.conversion.dustMax >= self.conversion.dustCap and 'Maximum Reached' or 'Raise limit from'" />
                  <div class="conversion-limit-values" *if="self.conversion.dustMax < self.conversion.dustCap">
                    <label *text="self.conversion.dustMax" />
                    <img src="/modules/game_forge/images/icon-currency-dust.png" />
                    <label text="to" />
                    <label *text="self.conversion.dustMax + 1" />
                    <img src="/modules/game_forge/images/icon-currency-dust.png" />
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="description">{{self.description}}</div>
        </div>
        <div *if="self.currentTab == 'history'">
          <div class="history-container" id="history">
            <div class="history-list">
              <div class="history-table-area">
                <ForgeHistoryHeader class="history-header" />
                <ForgeHistoryViewport class="history-viewport" onlayoutupdate="self.history.updateScroll(target)">
                  <table class="history-table">
                    <tbody>
                      <tr *for="local row in (self.history.list or {})" onclick="self.history.selectRow(target, row)">
                        <td class="history-date"><label class="history-cell-text" *color="self.history.selected == row and '#f4f4f4' or '#c0c0c0'" *text="row.createdAt" /></td>
                        <td class="history-action"><label class="history-cell-text" *color="self.history.selected == row and '#f4f4f4' or '#c0c0c0'" *text="row.actionType" /></td>
                        <td class="history-details" onlayoutupdate="self.history.configureDetails(target, row)"><label class="history-cell-text" *color="self.history.selected == row and '#f4f4f4' or '#c0c0c0'" *text="row.description" /></td>
                        <ForgeHistorySeparator class="history-separator-date" placement="top-left" />
                        <ForgeHistorySeparator class="history-separator-action" placement="top-left" />
                      </tr>
                    </tbody>
                  </table>
                </ForgeHistoryViewport>
              </div>
              <ForgeHistoryScrollBar id="historyScroll" class="history-scrollbar" />
              <ForgeHistoryFrame class="history-frame" placement="center" />
            </div>

            <div class="history-footer">
              <ForgeCloseButton
                *opacity="self.history.showPreviousButton and 1 or 0"
                *disabled="not self.history.showPreviousButton"
                class="history-footer-previous"
                onclick="self.history.onHistoryPreviousPage()"
                text="Previous Page"
              />
              <label class="history-page-label"
                *opacity="(self.history.showPreviousButton or self.history.showNextButton) and 1 or 0"
                *text="string.format('Page %d/%d', self.history.currentPage, self.history.lastPage)"
              />
              <ForgeCloseButton
                *opacity="self.history.showNextButton and 1 or 0"
                *disabled="not self.history.showNextButton"
                class="history-footer-next"
                onclick="self.history.onHistoryNextPage()"
                text="Next Page"
              />
            </div>
          </div>
        </div>
      </div>

      <ForgeSeparator class="separator" />

      <div class="footer">
        <div class="footer-content">
          <ForgeBalanceBox class="base-gold-bg">
            <label class="balance-value" *text="self.currentGold" />
            <img placement="center-right" style="margin-right: 3px; margin-top: 1px" src="/images/game/cyclopedia/icons/icon-goldcoin.png" width="9" height="9" />
          </ForgeBalanceBox>
          <ForgeBalanceBox
            class="base-resource-bg base-dust-resource-bg"
            style="margin-left: 5px"
          >
            <label class="balance-value" *text="self.currentDustAndMaxLabel" />
            <img placement="center-right"
              class="dust-icon"
              src="/modules/game_forge/images/icon-currency-dust.png"
              width="9"
              height="6"
              style="margin-right: 3px; margin-top: 1px"
            />
          </ForgeBalanceBox>
          <ForgeBalanceBox class="base-resource-bg" style="margin-left: 5px">
            <label class="balance-value" *text="self.currentSlivers" />
            <img placement="center-right"
              src="/modules/game_forge/images/icon-currency-sliver.png"
              width="9"
              height="9"
              style="margin-right: 3px; margin-top: 1px"
            />
          </ForgeBalanceBox>
          <ForgeBalanceBox class="base-resource-bg" style="margin-left: 5px">
            <label class="balance-value" *text="self.currentExaltedCores" />
            <img placement="center-right"
              src="/modules/game_forge/images/icon-currency-exaltedcore.png"
              width="9"
              height="9"
              style="margin-right: 3px; margin-top: 1px"
            />
          </ForgeBalanceBox>
        </div>
        <ForgeCloseButton class="close-btn" onclick="self:hide()" text="Close" />
      </div>
    </window>
    <UIWindow placement="center" class="result-window" onlayoutupdate="self:configureResultWindow(target)" *if="self.showResult or self.showBonus">
      <div class="result-dialog-frame" placement="top-left" />
      <img id="forgeResultDragonHeader" class="result-dragon-header" placement="top-left" src="/modules/game_forge/images/dragon-header.png" image-clip="0 0 192 70" />
      <label class="result-title" placement="top-left" *text="self.result.title" />
      <div class="result-content" placement="top-left" *if="self.showResult and not self.showBonus">
        <ForgeConversionItem class="result-left-item" placement="top-left" *item-id="self.result.leftItemId" *shader="self.result.leftShader" *opacity="self.result.leftOpacity">
          <img *if="self.result.leftTier > 0" class="item-tier-strip" placement="top-right"
            src="/images/inventory/tiers-strip-big.png" *image-clip="self.result.leftClip" />
        </ForgeConversionItem>
        <div class="result-arrows" placement="top-left">
          <img *for="local value in self.result.arrows" *image-source="value.arrow" width="14" height="25" />
        </div>
        <ForgeConversionItem class="result-right-item" placement="top-left" *item-id="self.result.rightItemId" *shader="self.result.rightShader" *opacity="self.result.rightOpacity">
          <img *if="self.result.rightDisplayTier > 0" class="item-tier-strip" placement="top-right"
            src="/images/inventory/tiers-strip-big.png" *image-clip="self.result.rightClip" />
        </ForgeConversionItem>
        <ForgeConversionItem class="result-left-item" placement="top-left" *if="self.result.leftOverlayOpacity > 0"
          *item-id="self.result.leftItemId" shader="Outfit - ForgeDonor" *opacity="self.result.leftOverlayOpacity">
          <img *if="self.result.leftTier > 0" class="item-tier-strip" placement="top-right" shader="Outfit - ForgeDonor"
            src="/images/inventory/tiers-strip-big.png" *image-clip="self.result.leftClip" />
        </ForgeConversionItem>
        <ForgeConversionItem class="result-right-item" placement="top-left" *if="self.result.rightOverlayOpacity > 0"
          *item-id="self.result.rightItemId" *shader="self.result.rightOverlayShader" *color="self.result.rightOverlayColor" *opacity="self.result.rightOverlayOpacity">
          <img *if="self.result.rightDisplayTier > 0" class="item-tier-strip" placement="top-right" *shader="self.result.rightOverlayShader ~= '' and 'Outfit - ForgeDonor' or ''"
            src="/images/inventory/tiers-strip-big.png" *image-clip="self.result.rightClip" *image-color="self.result.rightOverlayColor" />
        </ForgeConversionItem>
      </div>
      <div class="result-text" placement="top-left" *opacity="self.result.textOpacity" *if="self.result.label ~= '' and self.showResult and not self.showBonus">
        <label *text="self.result.label" />
        <label *text="self.result.labelResult:gsub('%.$', '')" *color="self.result.color" />
        <label text="." />
      </div>
      <div class="result-bonus" placement="top-left" *if="self.showBonus and not self.showResult">
        <ForgeConversionItem class="result-bonus-item" placement="top-left" *item-id="self.result.bonusItem">
          <img *if="self.result.bonusTier > 0 and self.result.bonusItemClip ~= nil" class="item-tier-strip" placement="top-right"
            src="/images/inventory/tiers-strip-big.png" *image-clip="self.result.bonusItemClip or {}" />
        </ForgeConversionItem>
        <div class="result-bonus-text" placement="top-left" *if="self.result.bonusIcon == ''">
          <label *for="local line in self.result.bonusLabel:split('\n')" *text="line" />
        </div>
        <div class="result-bonus-resource" placement="top-left" onlayoutupdate="self:alignBonusResourceIcon(target)" *if="self.result.bonusIcon ~= ''">
          <label *text="self.result.bonusPrefix" />
          <img id="forgeBonusResourceIcon" *image-source="self.result.bonusIcon" *height="self.result.bonusIconHeight"
            *margin-top="self.result.bonusIconTop" *margin-left="self.result.bonusIconGap" />
          <label class="result-bonus-suffix" *text="self.result.bonusSuffix" />
        </div>
      </div>
      <ForgeSeparator id="resultSeparator" class="result-separator" placement="bottom-left" />
      <ForgeCloseButton id="forgeResultActionButton" class="result-close-button" placement="bottom-right" *text="self.result.buttonLabel"
        *disabled="self.result.buttonLabel == ''" onclick="self.result.bonusAction()" />
    </UIWindow>
  </div>
</html>
